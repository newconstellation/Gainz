<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gainz Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="demo" id="demo"></div>
<nav id="side" aria-label="Main"></nav>
<main class="wrap" id="main"></main>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="music" id="music" hidden aria-label="Music player"></div>
<div class="rest" id="rest" hidden aria-live="polite"><span>Rest</span><b class="rest-t">1:00</b><button data-act="rest30">+30s</button><button data-act="restSkip">Skip</button><button data-act="restOff" aria-label="Turn off the rest timer">Off</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>
<div id="clock" class="clock" hidden role="dialog" aria-modal="true" aria-label="Workout timer"></div>


<!-- Your Supabase project's URL and public (anon) key. Leave them empty to run in demo mode. -->
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/exercise-library.js"></script>
<script src="js/store-supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
